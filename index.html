:root[data-theme="dark"]{--bg:#000000;--card:#141414;--card2:#262626;--text:#F5F5F5;--muted:#8E8E93;--line:#1C1C1E;--dim:#5A5A5E;--nbg:#F5F5F5;--ntext:#000000;--green:#30C464;--shadow:none;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,system-ui,sans-serif;overscroll-behavior:none}
button,select,input,a{font:inherit}
button{outline:none;transition:transform .14s cubic-bezier(.2,.8,.2,1),opacity .14s ease,filter .14s ease,background-color .14s ease;touch-action:manipulation}
button:focus{outline:none}
button.pressed{transform:scale(.94);opacity:.85;filter:brightness(1.15)}
.btn.pressed{transform:scale(.96)}
.ic.pressed{transform:scale(.86)}
.spk.pressed{transform:scale(.9);box-shadow:0 6px 24px rgba(255,36,66,.55)}
.tab.pressed{transform:scale(.9);opacity:1}
.tab.pressed svg{transform:translateY(-2px)}
.tab svg{transition:transform .14s ease}
.chip.pressed{transform:scale(.92)}
.lst.pressed{transform:scale(.94)}
.pill{transition:none}
@keyframes aparece{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card,.q{animation:aparece .22s ease}
.ring.on{animation:latido .9s ease}
@keyframes latido{0%{box-shadow:0 0 0 20px rgba(255,36,66,.08),0 0 0 44px rgba(255,36,66,.04)}40%{box-shadow:0 0 0 30px rgba(255,36,66,.16),0 0 0 60px rgba(255,36,66,.06)}100%{box-shadow:0 0 0 20px rgba(255,36,66,.08),0 0 0 44px rgba(255,36,66,.04)}}
.zhf{font-family:'Noto Sans SC','PingFang SC',system-ui,sans-serif}
.app{height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto}
.hdr{flex:none;padding:max(calc(env(safe-area-inset-top,0px) + 14px),64px) 20px 12px;display:grid;grid-template-columns:40px 1fr 40px;align-items:center;border-bottom:1px solid var(--line)}
.hdr h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em;text-align:center}
.hdr .ic{grid-column:3}
.ic{width:40px;height:40px;border-radius:20px;border:0;background:var(--card2);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer}
.main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 20px 12px;display:flex;flex-direction:column}
.hidden{display:none!important}
/* estudiar */
#estudio{flex:1;display:flex;flex-direction:column;justify-content:center;gap:28px;padding:10px 0 20px}
.q{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:32px;text-align:center}
.acc{display:flex;gap:12px;width:100%;max-width:400px;margin:0 auto}
.pill{font-size:12px;font-weight:700;padding:6px 12px;border-radius:999px;background:var(--accent);color:#fff;letter-spacing:.04em}
.pill.g{background:var(--card2);color:var(--muted);font-weight:600;font-size:13px;padding:7px 14px}
.pill.n{background:var(--card2);color:var(--accent)}
.zh{font-size:52px;line-height:1.3;font-weight:500}
.es{font-size:28px;line-height:1.35;font-weight:600;padding:0 8px}
.hint{font-size:15px;color:var(--muted)}
.ring{width:236px;height:236px;border-radius:118px;background:var(--card);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 20px rgba(255,36,66,.08),0 0 0 44px rgba(255,36,66,.04)}
.spk{width:136px;height:136px;border-radius:68px;border:0;background:var(--accent);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 14px 44px rgba(255,36,66,.4)}
.card{background:var(--card);border-radius:20px;padding:26px 22px 22px;display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center;box-shadow:var(--shadow)}
.ruby{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 10px}
.ruby .c{display:flex;flex-direction:column;align-items:center;gap:6px}
.ruby .c .h{font-size:46px;line-height:1.05;font-weight:500}
.ruby.big .c .h{font-size:74px}
.ruby .c .p{font-size:14px;font-weight:600;color:var(--accent);min-height:16px}
.ruby.big .c .p{font-size:16px}
.ruby .pt .h{font-size:34px;color:var(--muted)}
.ruby.sm{justify-content:flex-start;gap:8px 6px}
.ruby.sm .c{gap:3px}
.ruby.sm .c .h{font-size:24px;font-weight:500}
.ruby.sm .c .p{font-size:12px;min-height:14px}
.ruby.sm .pt .h{font-size:20px}
.trad{font-size:23px;font-weight:700;letter-spacing:-.01em;line-height:1.3}
.sep{width:100%;height:1px;background:var(--line)}
.ej{display:flex;flex-direction:column;gap:6px;width:100%;text-align:left}
.ej .lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ej .z{font-size:21px;line-height:1.5}
.ej .e{font-size:14px;color:var(--muted)}
.lst{display:flex;align-items:center;gap:8px;height:44px;padding:0 20px;border-radius:22px;border:0;background:var(--card2);color:var(--text);font-size:15px;font-weight:600;cursor:pointer}
.dots{display:flex;gap:6px}
.dots span{width:8px;height:8px;border-radius:4px;background:var(--card2)}
.dots span.on{background:var(--green)}
.acts{display:none}
.btn{flex:1;height:56px;border-radius:28px;border:0;font-size:17px;font-weight:700;cursor:pointer;color:#fff;background:var(--accent)}
.btn.neu{background:var(--nbg);color:var(--ntext)}
.btn.ok{background:var(--green)}
/* tab bar */
.tabs{flex:none;display:flex;justify-content:space-around;align-items:center;padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 10px);border-top:1px solid var(--line);background:var(--bg)}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 12px;min-width:64px;background:none;border:0;cursor:pointer;color:var(--muted);font-size:11px;font-weight:600}
.tab.on{color:var(--text);font-weight:700}
.tab svg{stroke:currentColor}
/* vocabulario */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:13px;font-weight:600;padding:8px 14px;border-radius:999px;border:0;background:var(--card2);color:var(--text);cursor:pointer}
.chip.on{background:var(--text);color:var(--bg);font-weight:700}
.chip.lock{color:var(--dim)}
.search{display:flex;align-items:center;gap:10px;height:46px;padding:0 16px;border-radius:23px;background:var(--card2);margin-top:6px}
.search input{flex:1;border:0;background:transparent;color:var(--text);font-size:15px;outline:none;min-width:0}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:14px 0 8px}
.meta b{color:var(--text)}
.list{background:var(--card);border-radius:20px;padding:2px 18px;box-shadow:var(--shadow)}
.it{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.it:last-child{border:0}
.it .z{font-size:23px;font-weight:500}.it .p{font-size:13px;font-weight:600;color:var(--accent);margin-top:2px}.it .e{font-size:14px;color:var(--muted);margin-top:2px}

.dot.d{background:var(--green)}.dot.a{background:var(--amber)}.dot.n{border:1.5px solid var(--dim)}
/* progreso */
.pc{background:var(--card);border-radius:20px;padding:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;margin-top:14px}
.pc .lbl{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.bigN{display:flex;align-items:baseline;gap:8px}
.bigN b{font-size:56px;font-weight:800;letter-spacing:-.04em;line-height:1}
.bigN span{font-size:16px;font-weight:600;color:var(--muted)}
.bar{height:10px;border-radius:5px;background:var(--card2);overflow:hidden;flex:1}
.bar div{height:100%;border-radius:5px;background:var(--accent)}
.lvl{display:flex;align-items:center;gap:12px;font-size:13px;font-weight:700}
.lvl .n{width:48px;color:var(--muted)}.lvl .v{width:40px;text-align:right}
.lvl.off .n,.lvl.off .v{color:var(--dim)}
.rowc{display:flex;align-items:center;justify-content:space-between;gap:16px}
.rowc .t{font-size:16px;font-weight:700}.rowc .s{font-size:14px;color:var(--muted);margin-top:4px}

.link{background:none;border:0;color:var(--accent);font-size:15px;font-weight:600;padding:6px 0 0;cursor:pointer;text-align:left}

function seed(){
  st={items:{}}; const now=Date.now();
  ITEMS.forEach(it=>{ const r=Math.random();
    if(it.niv===1) st.items[it.id]={seen:true,streak:3,due:now+(r<0.25?-1:1)*Math.random()*14*D};
    else if(it.niv===2) st.items[it.id]={seen:true,streak:r<0.8?3:2,due:now+(r<0.35?-1:1)*Math.random()*7*D};
    else if(it.niv===3&&r<0.75) st.items[it.id]={seen:true,streak:r<0.3?2:1,due:now-Math.random()*2*D}; });
  save();
}

const seen = it => st.items[it.id] && st.items[it.id].seen;
const dominada = it => seen(it) && st.items[it.id].streak>=DOM;
function progreso(n){ const its=ITEMS.filter(i=>i.niv===n); return its.filter(i=>seen(i)&&st.items[i.id].streak>=1).length/its.length; }
function desbloqueado(n){ const i=NIVELES.indexOf(n); return i===0||progreso(NIVELES[i-1])>=UNLOCK; }
function nivelActual(){ let a=NIVELES[0]; for(const n of NIVELES){ if(desbloqueado(n)) a=n; } return a; }
function pendientes(){ const now=Date.now(); return ITEMS.filter(i=>seen(i)&&st.items[i.id].due<=now).length; }

// ---------- Selección ----------
function ponderado(p){ const t=p.reduce((a,x)=>a+x[1],0); let r=Math.random()*t; for(const x of p){ if((r-=x[1])<0) return x[0]; } return p[0][0]; }
const rnd = a => a[Math.floor(Math.random()*a.length)];
function elegir(){
  retry.forEach(r=>r.after--);
  const k=retry.findIndex(r=>r.after<=0);
  if(k>=0) return ITEMS.find(i=>i.id===retry.splice(k,1)[0].id);
  const now=Date.now(), act=nivelActual();
  const abiertos=NIVELES.filter(n=>n<=act);
  const lvl=ponderado(abiertos.map(n=>{const d=act-n; return [n,d===0?50:d===1?25:Math.max(8,25/d)];}));
  const tipo=ponderado([['w',30],['p',35],['s',35]]);
  const orden=[lvl,...abiertos.filter(x=>x!==lvl).reverse()];
  const prefer=arr=>{const f=arr.filter(i=>i.tipo===tipo); return f.length?f:arr;};
  for(const L of orden){
    const pool=ITEMS.filter(i=>i.niv===L&&!recent.includes(i.id)&&!retry.some(r=>r.id===i.id));
    const due=pool.filter(i=>seen(i)&&st.items[i.id].due<=now);
    const nuevas=pool.filter(i=>!seen(i));
    if(due.length&&(!nuevas.length||Math.random()<0.7)) return rnd(prefer(due).sort((a,b)=>st.items[a.id].due-st.items[b.id].due).slice(0,6));
    if(nuevas.length){ const pal=nuevas.filter(i=>i.tipo==='w'), fr=nuevas.filter(i=>i.tipo!=='w'); if(pal.length&&(!fr.length||Math.random()<0.6)) return pal[0]; return (fr.length?fr:pal)[0]; }
    const extra=pool.filter(seen).sort((a,b)=>st.items[a.id].due-st.items[b.id].due).slice(0,8);
    if(extra.length) return rnd(prefer(extra));
  }
  return rnd(ITEMS);
}
function ejemplo(it){
  if(it.tipo!=='w') return null;
  const base=it.zh.replace(PUNT,'');
  const c=ITEMS.filter(x=>x.tipo!=='w'&&x.niv<=it.niv&&x.zh.includes(base));
  return c.length?rnd(c):null;
}

}

function renderVocab(){
  const v=document.getElementById('vocab');
  v.innerHTML=`<div class="chips">${[1,2,3,4,5,6].map(n=>{const ex=NIVELES.includes(n), ok=ex&&desbloqueado(n); return `<button class="chip ${n===filtro?'on':''} ${ok?'':'lock'}" onclick="setFiltro(${n})">HSK ${n}</button>`;}).join('')}</div>
    <label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="color:var(--muted)"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input type="search" placeholder="Buscar en chino, pinyin o español" value="${busq}" oninput="setBusq(this.value)"></label>
    <div class="meta" id="vmeta"></div><div class="list" id="vlista"></div>`;
  renderVocabLista();
}
function renderVocabLista(){
  let its=ITEMS.filter(i=>i.niv===filtro);
  const total=its.length;
  if(busq) its=its.filter(i=>i.zh.includes(busq)||i.py.join(' ').toLowerCase().includes(busq)||i.es.toLowerCase().includes(busq));
  const dom=ITEMS.filter(i=>i.niv===filtro&&dominada(i)).length;
  const meta=document.getElementById('vmeta'), l=document.getElementById('vlista');
  if(!total){ meta.innerHTML=`<span>Este nivel todavía no está cargado</span>`; l.innerHTML=''; return; }
  meta.innerHTML=`<span>${total} elementos · <b>${dom}</b> dominados</span><span>${desbloqueado(filtro)?'<b>'+Math.round(progreso(filtro)*100)+' %</b>':'🔒 al 70 % del anterior'}</span>`;
  l.innerHTML=its.slice(0,400).map(i=>{const r=st.items[i.id]; const d=!(r&&r.seen)?'n':(r.streak>=DOM?'d':'a'); return `<div class="it"><div><div class="z zhf">${limpio(i.zh)}</div><div class="p">${i.py.join(' ')}</div><div class="e">${i.es} · <span style="color:var(--dim)">${categoria(i)}</span></div></div><span class="dot ${d}"></span></div>`;}).join('')||'<div class="it"><div class="e">Sin resultados</div></div>';
}
function renderProgreso(){
  const p=document.getElementById('progreso');
  const domTot=ITEMS.filter(i=>i.tipo==='w'&&dominada(i)).length;
  const bars=[1,2,3,4,5,6].map(n=>{const its=ITEMS.filter(i=>i.niv===n&&i.tipo==='w'); const d=its.filter(dominada).length; const tot=TOTAL_HSK[n]; const off=!its.length||!desbloqueado(n); return `<div class="lvl ${off?'off':''}"><span class="n">HSK ${n}</span><div class="bar"><div style="width:${tot?Math.round(d/tot*100):0}%"></div></div><span class="v">${d}</span></div>`;}).join('');
  p.innerHTML=`<div class="pc"><span class="lbl">Vocabulario dominado</span><div class="bigN"><b>${domTot}</b><span>de 5 000 palabras</span></div><div class="bar" style="height:8px;flex:none"><div style="width:${Math.round(domTot/50)}%"></div></div></div>
    <div class="pc"><span style="font-size:16px;font-weight:700">Por nivel</span>${bars}</div>
    <div class="pc rowc"><div><div class="t">Pendientes de repaso</div><div class="s">${pendientes()} tarjetas esperan · ${sesion} hechas hoy</div></div><span class="k zhf">复习</span></div>
    <div class="pc"><span class="lbl">Audio</span><select class="voz" onchange="setVoz(this.value)">${opcionesVoz()}</select><span class="small">★ = voz de alta calidad. Si no ves ninguna, descarga una voz china «mejorada» en los ajustes de accesibilidad del móvil.</span></div>
    <div class="pc"><span class="lbl">Copia de seguridad</span>
      <span class="small">El progreso se guarda en este iPhone. Guarda una copia de vez en cuando en Archivos o iCloud Drive.</span>
      <div style="display:flex;gap:10px"><button class="btn neu" style="height:48px;font-size:15px" onclick="guardarCopia()">Guardar copia</button><button class="btn neu" style="height:48px;font-size:15px;background:var(--card2);color:var(--text)" onclick="cargarCopia()">Cargar copia</button></div>
      <input type="file" id="archivoCopia" accept=".json,application/json" class="hidden" onchange="leerCopia(this)">
      <span class="small" id="aviso" style="transition:opacity .4s;opacity:0;min-height:16px"></span>
    </div>
    <div class="pc"><span class="lbl">Datos</span><button class="link" onclick="reset()">Borrar todo el progreso</button></div>`;
}
// Feedback táctil (iOS no aplica :active sin esto)
(function(){
  let activo=null;
  const soltar=()=>{ if(activo){ const b=activo; activo=null; setTimeout(()=>b.classList.remove('pressed'),90); } };
  document.addEventListener('pointerdown',e=>{ const b=e.target.closest('button'); if(!b||b.disabled) return; activo=b; b.classList.add('pressed'); },{passive:true});
  document.addEventListener('pointerup',soltar,{passive:true});
  document.addEventListener('pointercancel',soltar,{passive:true});
  document.addEventListener('pointerleave',soltar,{passive:true});
  document.addEventListener('touchstart',()=>{},{passive:true});
})();
load(); siguiente(); irA('estudio');
if('serviceWorker' in navigator){ window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }); }
